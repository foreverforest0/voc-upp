<meta charset="utf-8">
<title>ЕГЭ Крафт</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --color-canvas:#fff3e7;
    --color-ink:#030302;
    --color-white:#ffffff;
    --color-linen:#f7f4ef;
    --color-cloud:#efefef;
    --color-ash:#e1ded7;
    --color-stone:#a9a29a;
    --color-graphite:#41413f;
    --color-mint:#9bd8a9;
    --color-mint-ink:#1f5233;
    --color-marigold:#fde99b;
    --color-marigold-ink:#6b5510;
    --color-periwinkle:#b8caf5;
    --color-periwinkle-ink:#2c3d78;
    --color-sky-1:#9ed4ef;
    --color-sky-2:#d1eef9;
    --color-sky-ink:#1c5a75;
    --color-azure:#0087ff;
    --color-papaya:#ff4500;
    --color-good:#3f8f5b;
    --color-bad:#c4472c;

    --font-serif:'Lora', ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    --font-sans:'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --shadow-xl: rgba(3,3,2,.03) 0px 40px 40px 0px, rgba(3,3,2,.05) 0px 16px 32px 0px, rgba(3,3,2,.08) 0px 3px 10px 0px;
    --shadow-md: rgba(3,3,2,.10) 0px 12px 12px 2px, rgba(3,3,2,.06) 0px 2px 4px -1px;
    --shadow-sm: rgba(3,3,2,.10) 0px 4px 6px -1px, rgba(3,3,2,.08) 0px 2px 4px -2px;
    --shadow-subtle: rgba(3,3,2,.08) 0px 1px 3px 0px, rgba(3,3,2,.08) 0px 1px 2px -1px;

    --radius-card:20px;
    --radius-pill:9999px;
    --radius-input:14px;
  }

  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--color-canvas);
    color:var(--color-ink);
    font-family:var(--font-sans);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;text-wrap:balance;}
  p{margin:0;}
  ul{margin:0;padding:0;list-style:none;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--color-azure);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  .serif{font-family:var(--font-serif);font-weight:400;}
  .label-caps{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--color-stone);}
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{
    width:272px;flex:0 0 272px;background:var(--color-linen);
    border-right:1px solid var(--color-ash);
    padding:24px 18px;display:flex;flex-direction:column;gap:22px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .main{flex:1;min-width:0;padding:40px 44px 90px;}
  .main-inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:32px;}

  @media (max-width:880px){
    .shell{flex-direction:column;}
    .sidebar{position:relative;top:auto;height:auto;width:100%;flex:none;flex-direction:row;align-items:center;overflow-x:auto;padding:14px 16px;gap:14px;}
    .sidebar-scroll{display:flex;flex-direction:row;gap:8px;flex:1;}
    .sidebar-section{display:none;}
    .sidebar-streak{display:none;}
    .main{padding:24px 18px 70px;}
  }

  /* ---------- logo & nav ---------- */
  .logo{display:flex;align-items:center;gap:9px;padding:2px 2px 4px;}
  .logo-badge{background:var(--color-ink);color:var(--color-white);font-weight:700;font-size:13px;letter-spacing:.02em;padding:6px 10px;border-radius:var(--radius-pill);}
  .logo-word{font-family:var(--font-serif);font-style:italic;font-size:20px;}

  .cta-pill{
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--color-ink);color:var(--color-white);
    border:none;border-radius:var(--radius-pill);
    padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .cta-pill:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .cta-ghost{
    display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--color-ink);
    border:1px solid var(--color-ash);border-radius:var(--radius-pill);padding:9px 16px;
    font-weight:600;font-size:14px;cursor:pointer;transition:background .15s ease;
  }
  .cta-ghost:hover{background:var(--color-cloud);}

  .nav-list{display:flex;flex-direction:column;gap:2px;}
  .nav-link{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
    color:var(--color-graphite);font-size:14px;font-weight:500;cursor:pointer;border:none;background:transparent;
    text-align:left;width:100%;
  }
  .nav-link:hover{background:var(--color-cloud);}
  .nav-link.is-active{background:var(--color-white);box-shadow:var(--shadow-subtle);color:var(--color-ink);}
  .nav-link svg{flex:0 0 auto;}
  .nav-badge{margin-left:auto;background:var(--color-papaya);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--radius-pill);}
  .nav-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

  .sidebar-section{display:flex;flex-direction:column;gap:6px;}
  .sidebar-divider{height:1px;background:var(--color-ash);margin:2px 0;}

  .streak-card{
    margin-top:auto;background:var(--color-white);border-radius:16px;padding:14px;
    display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-subtle);
  }
  .streak-flame{font-size:20px;}

  /* ---------- generic bits ---------- */
  .card{background:var(--color-white);border-radius:var(--radius-card);padding:24px;box-shadow:var(--shadow-xl);}
  .card-flat{background:var(--color-white);border-radius:16px;padding:18px;border:1px solid var(--color-ash);}
  .row{display:flex;align-items:center;}
  .col{display:flex;flex-direction:column;}
  .gap-4{gap:4px;} .gap-6{gap:6px;} .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .gap-24{gap:24px;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .muted{color:var(--color-stone);}
  .graphite{color:var(--color-graphite);}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;background:var(--color-cloud);color:var(--color-graphite);border:none;cursor:pointer;white-space:nowrap;}
  .chip.is-on{background:var(--color-ink);color:var(--color-white);}
  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;letter-spacing:.02em;}
  .status-new{background:var(--color-cloud);color:var(--color-graphite);}
  .status-learning{background:var(--color-marigold);color:var(--color-marigold-ink);}
  .status-review{background:var(--color-periwinkle);color:var(--color-periwinkle-ink);}
  .status-done{background:var(--color-mint);color:var(--color-mint-ink);}

  .progress-track{height:8px;border-radius:var(--radius-pill);background:var(--color-cloud);overflow:hidden;}
  .progress-fill{height:100%;border-radius:var(--radius-pill);}

  .torn{clip-path:polygon(0% 4%,7% 0%,15% 3%,24% 0%,33% 4%,42% 1%,52% 5%,61% 2%,70% 6%,80% 1%,90% 4%,100% 0%,100% 96%,92% 100%,83% 97%,74% 100%,64% 96%,55% 100%,45% 97%,36% 100%,26% 96%,17% 100%,8% 97%,0% 100%);}

  .hero-banner{position:relative;border-radius:28px;padding:34px 30px;overflow:hidden;background:var(--color-white);box-shadow:var(--shadow-xl);}
  .hero-shape{position:absolute;opacity:.55;}
  .hero-content{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;}

  .subject-band{border-radius:24px;padding:26px 28px;position:relative;overflow:hidden;box-shadow:var(--shadow-xl);}
  .subject-band .torn{position:absolute;inset:0;z-index:0;opacity:.5;}
  .subject-band-content{position:relative;z-index:1;}

  .tabbar{display:inline-flex;padding:4px;background:var(--color-cloud);border-radius:var(--radius-pill);gap:2px;}
  .tabbar button{border:none;background:transparent;padding:8px 18px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;cursor:pointer;color:var(--color-graphite);}
  .tabbar button.is-active{background:var(--color-white);color:var(--color-ink);box-shadow:var(--shadow-subtle);}

  details.topic-acc{background:var(--color-white);border-radius:16px;box-shadow:var(--shadow-subtle);overflow:hidden;}
  details.topic-acc + details.topic-acc{margin-top:10px;}
  details.topic-acc summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:14px;}
  details.topic-acc summary::-webkit-details-marker{display:none;}
  .acc-chevron{margin-left:auto;transition:transform .18s ease;color:var(--color-stone);}
  details.topic-acc[open] .acc-chevron{transform:rotate(90deg);}
  .acc-body{padding:0 18px 20px 18px;display:flex;flex-direction:column;gap:16px;}
  .acc-swatch{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}

  .bullet-list{display:flex;flex-direction:column;gap:8px;}
  .bullet-list li{display:flex;gap:9px;font-size:14px;line-height:1.55;}
  .bullet-list li::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:8px;flex:0 0 auto;opacity:.5;}

  .qtype-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:var(--radius-pill);background:var(--color-linen);color:var(--color-graphite);border:1px solid var(--color-ash);}

  .practice-card{background:var(--color-white);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-subtle);cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s ease, transform .15s ease;}
  .practice-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}

  .opt-row{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--color-ash);border-radius:var(--radius-input);cursor:pointer;font-size:15px;}
  .opt-row:hover{background:var(--color-linen);}
  .opt-row.correct{border-color:var(--color-good);background:#eef8f0;}
  .opt-row.incorrect{border-color:var(--color-bad);background:#fbeeea;}
  .opt-row input{margin-top:3px;}

  .text-input{width:100%;padding:12px 14px;border:1px solid var(--color-ash);border-radius:var(--radius-input);font-size:15px;background:var(--color-white);}
  .text-input:focus{border-color:var(--color-azure);}

  select.match-select{padding:9px 12px;border:1px solid var(--color-ash);border-radius:12px;background:var(--color-white);font-size:14px;min-width:190px;}

  .feedback-box{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.55;}
  .feedback-box.ok{background:#eef8f0;border:1px solid var(--color-good);}
  .feedback-box.no{background:#fbeeea;border:1px solid var(--color-bad);}

  .figure-box{background:var(--color-linen);border:1px solid var(--color-ash);border-radius:16px;padding:16px;display:flex;justify-content:center;}
  .figure-box svg{max-width:100%;height:auto;display:block;}

  .order-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--color-ash);border-radius:12px;background:var(--color-white);}
  .order-btns{display:flex;flex-direction:column;gap:2px;margin-left:auto;}
  .order-btns button{border:none;background:var(--color-cloud);width:26px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;}

  .progress-dots{display:flex;gap:5px;}
  .progress-dots span{width:8px;height:8px;border-radius:50%;background:var(--color-ash);}
  .progress-dots span.done{background:var(--color-ink);}
  .progress-dots span.now{background:var(--color-azure);}

  .modal-overlay{position:fixed;inset:0;background:rgba(3,3,2,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-card{background:var(--color-canvas);border-radius:24px;padding:28px;max-width:460px;width:100%;box-shadow:var(--shadow-xl);}

  .bars{display:flex;align-items:flex-end;gap:6px;height:56px;}
  .bars .bar{flex:1;border-radius:5px 5px 2px 2px;background:var(--color-ash);}

  .flashcard{
    background:var(--color-white);border-radius:24px;box-shadow:var(--shadow-xl);
    padding:40px 32px;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;
    cursor:pointer;font-family:var(--font-serif);font-size:22px;line-height:1.35;
  }
  .flashcard .back-text{font-family:var(--font-sans);font-size:16px;line-height:1.5;}

  .calendar-strip{display:flex;gap:5px;}
  .calendar-strip span{width:14px;height:14px;border-radius:4px;background:var(--color-ash);}
  .calendar-strip span.on{background:var(--color-mint);}
</style>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div class="main-inner" id="main"></div></main>
</div>
<div id="modal-root"></div>

<script>
/* ================= ICONS ================= */
function icon(name, sizeOrColor){
  const s = 20;
  const common = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  const shapes = {
    home:'<path d="M4 10.5 12 4l8 6.5" ' + common + '/><path d="M6 9.5V19a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1V9.5" ' + common + '/>',
    flag:'<path d="M6 3v18" ' + common + '/><path d="M6 4c2-1.2 3.8-1.2 5.8 0 2 1.2 3.8 1.2 5.8 0v8c-2 1.2-3.8 1.2-5.8 0-2-1.2-3.8-1.2-5.8 0Z" ' + common + '/>',
    cards:'<rect x="3.5" y="7" width="13" height="13" rx="2.4" ' + common + '/><path d="M7.5 7V5.6A2 2 0 0 1 9.4 3.6h8.1A2 2 0 0 1 19.5 5.6v8.1a2 2 0 0 1-2 2H16" ' + common + '/>',
    chart:'<path d="M4 20V9" ' + common + '/><path d="M10 20V4" ' + common + '/><path d="M16 20v-7" ' + common + '/><path d="M3 20h18" ' + common + '/>',

    dna:'<path d="M7 3c0 5 10 5 10 10s-10 5-10 10" ' + common + '/><path d="M17 3c0 5-10 5-10 10s10 5 10 10" ' + common + '/><path d="M8.3 7.2h7.4M7.6 12h8.8M8.3 16.8h7.4" ' + common + '/>',
    scale:'<path d="M12 3v14" ' + common + '/><path d="M6 6h12" ' + common + '/><path d="M4 6l-2.5 5a2.5 2.5 0 0 0 5 0Z" ' + common + '/><path d="M22 6l-2.5 5a2.5 2.5 0 0 0 5 0Z" ' + common + '/><path d="M8 21h8" ' + common + '/>',
    pen:'<path d="M4 20l1-4.2L15.8 5a1.6 1.6 0 0 1 2.3 0l0.9.9a1.6 1.6 0 0 1 0 2.3L8.2 19 4 20Z" ' + common + '/>',
    columns:'<path d="M4 21V9l8-5 8 5v12" ' + common + '/><path d="M2 21h20" ' + common + '/><path d="M9 21v-7M15 21v-7" ' + common + '/>',
    ruler:'<path d="M4 15 15 4l5 5-11 11-5-5Z" ' + common + '/><path d="M13.5 7.5l1.6 1.6M10.5 10.5l1.6 1.6M7.5 13.5l1.6 1.6" ' + common + '/>',
    flame:'<path d="M12 3c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1.4-.9-2-.9-3.2 1.6 1 2.9 3 2.9 5.2a5 5 0 0 1-10 0C7 9 9.5 6.5 12 3Z" ' + common + '/>',
    clock:'<circle cx="12" cy="12" r="8.5" ' + common + '/><path d="M12 7.5V12l3 2" ' + common + '/>',
    check:'<path d="M4 12l5 5L20 6" ' + common + '/>',
    x:'<path d="M6 6l12 12M18 6L6 18" ' + common + '/>',
    arrow:'<path d="M5 12h14M13 6l6 6-6 6" ' + common + '/>'
  };
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24">'+ (shapes[name]||'') +'</svg>';
}

/* ================= DATA ================= */
const SUBJECTS = [
  {
    id:'bio', name:'Биология', short:'Био', color:'mint', icon:'dna',
    topics:[
      {
        id:'bio-cell', title:'Клетка: строение и метаболизм',
        summary:'Органоиды, обмен веществ, фотосинтез и дыхание — основа заданий №1–7 и №22–24.',
        theory:{
          points:[
            'Клетка — элементарная единица живого; выделяют прокариотические и эукариотические клетки.',
            'Митохондрии — «энергетические станции» клетки: в них идёт клеточное дыхание с образованием АТФ.',
            'Хлоропласты есть только у растительных клеток и части протистов; в них проходит фотосинтез.',
            'Рибосомы синтезируют белок по матрице иРНК — свободно в цитоплазме и на мембранах ЭПС.'
          ],
          skills:['Сравнивать строение растительной и животной клетки','Определять органоид по функции и рисунку','Составлять схему энергетического обмена'],
          mistakes:['Путают функции комплекса Гольджи и ЭПС','Забывают, что клеточная стенка есть и у грибов (из хитина, а не целлюлозы)','Считают, что фотосинтез идёт только на свету — забывают о темновой фазе']
        },
        questions:[
          {id:'q-bio-1', type:'single', prompt:'Какой органоид клетки обеспечивает синтез основного количества АТФ в присутствии кислорода?', options:['Митохондрия','Рибосома','Лизосома','Комплекс Гольджи'], correctIndex:0, explanation:'АТФ образуется в митохондриях в ходе кислородного этапа клеточного дыхания на кристах — складках внутренней мембраны.'},
          {id:'q-bio-2', type:'single', prompt:'Выберите структуру, характерную только для растительной клетки.', options:['Митохондрия','Рибосома','Клеточная стенка из целлюлозы','Ядро'], correctIndex:2, explanation:'Митохондрии, рибосомы и ядро есть и у животных клеток. Целлюлозная клеточная стенка — признак растительной клетки.'},

function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }
function gcdOf(a,b){ a=Math.abs(a); b=Math.abs(b); return b? gcdOf(b,a%b) : a; }
function fmtCoeff(a){ if(a===1) return ''; if(a===-1) return '-'; return String(a); }
function fmtSigned(n){ return n>=0 ? ' + '+n : ' - '+Math.abs(n); }
function genId(topicId){ return 'gen-'+topicId+'-'+Date.now()+'-'+Math.floor(Math.random()*1e6); }

/* reusable original diagram renderers — parametrized, nothing traced from any source */
function renderVectorFigure(ax,ay,bx,by){
  const minX=Math.min(0,ax,bx)-1, maxX=Math.max(0,ax,bx)+1;
  const minY=Math.min(0,ay,by)-1, maxY=Math.max(0,ay,by)+1;
  const u=40, pad=26;
  const w=pad*2+(maxX-minX)*u, h=pad*2+(maxY-minY)*u;
  const ox=pad+(0-minX)*u, oy=pad+(maxY-0)*u;
  const toPx=(x,y)=>[ox+x*u, oy-y*u];
  let grid='';
  for(let gx=minX; gx<=maxX; gx++){ const px=toPx(gx,0)[0]; grid+=`<line x1="${px}" y1="${pad}" x2="${px}" y2="${h-pad}" stroke="var(--color-ash)" stroke-width="1"/>`; }
  for(let gy=minY; gy<=maxY; gy++){ const py=toPx(0,gy)[1]; grid+=`<line x1="${pad}" y1="${py}" x2="${w-pad}" y2="${py}" stroke="var(--color-ash)" stroke-width="1"/>`; }
  const [apx,apy]=toPx(ax,ay), [bpx,bpy]=toPx(bx,by);
  const defs=`<defs><marker id="arrAxisV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-ink)"/></marker><marker id="arrAV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-papaya)"/></marker><marker id="arrBV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-azure)"/></marker></defs>`;
  const axes=`<line x1="${pad-10}" y1="${oy}" x2="${w-pad+10}" y2="${oy}" stroke="var(--color-ink)" stroke-width="1.6" marker-end="url(#arrAxisV)"/><line x1="${ox}" y1="${h-pad+10}" x2="${ox}" y2="${pad-10}" stroke="var(--color-ink)" stroke-width="1.6" marker-end="url(#arrAxisV)"/>`;
  const vecA=`<line x1="${ox}" y1="${oy}" x2="${apx}" y2="${apy}" stroke="var(--color-papaya)" stroke-width="3" marker-end="url(#arrAV)"/><text x="${apx+(apx>=ox?8:-16)}" y="${apy-4}" font-size="15" font-weight="700" fill="var(--color-papaya)">a</text>`;
  const vecB=`<line x1="${ox}" y1="${oy}" x2="${bpx}" y2="${bpy}" stroke="var(--color-azure)" stroke-width="3" marker-end="url(#arrBV)"/><text x="${bpx+(bpx>=ox?8:-16)}" y="${bpy-4}" font-size="15" font-weight="700" fill="var(--color-azure)">b</text>`;
  const oLabel=`<text x="${ox-16}" y="${oy+18}" font-size="12" fill="var(--color-graphite)">O</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${defs}${grid}${axes}${vecA}${vecB}${oLabel}</svg>`;
}

function renderBarChartFigure(labels, values){
  const w=280, h=170, pad=34, barW=36, gap=16, maxV=Math.max(...values), scale=(h-pad-24)/maxV;
  let bars='';
  const palette=['var(--color-mint)','var(--color-marigold)','var(--color-periwinkle)','var(--color-sky-1)','var(--color-papaya)'];
  values.forEach((v,i)=>{
    const x=pad+i*(barW+gap), barH=v*scale, y=h-pad-barH;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${palette[i%palette.length]}" fill-opacity="0.6" stroke="var(--color-ink)" stroke-width="1.2"/>`;
    bars += `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--color-ink)">${v}</text>`;
    bars += `<text x="${x+barW/2}" y="${h-pad+18}" text-anchor="middle" font-size="11" fill="var(--color-graphite)">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h+10}" xmlns="http://www.w3.org/2000/svg"><line x1="${pad-8}" y1="${h-pad}" x2="${w-10}" y2="${h-pad}" stroke="var(--color-ink)" stroke-width="1.4"/>${bars}</svg>`;

function utf8ToBase64(str){ const bytes = new TextEncoder().encode(str); let bin=''; bytes.forEach(b=> bin+=String.fromCharCode(b)); return btoa(bin); }
function base64ToUtf8(b64){ const bin = atob(b64.replace(/\n/g,'')); const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }

    const res = await ghRequest('/contents/ege-craft-progress.json');
    if(res.status===200){
      const data = await res.json();
      ghSha = data.sha;
      const remote = JSON.parse(base64ToUtf8(data.content));
      state = Object.assign(defaultState(), remote);
      try{ localStorage.setItem('ege-craft-v1', JSON.stringify(state)); }catch(e){}
      ghStatus='on';
    } else if(res.status===404){
      ghStatus='on';
      await pushToGithub();
    } else if(res.status===401 || res.status===403){
      ghStatus='error'; ghErrorMsg='Токен недействителен или не хватает прав доступа.';
    } else {
      ghStatus='error'; ghErrorMsg='Не удалось подключиться (код '+res.status+').';
    }
  }catch(e){
    ghStatus='error'; ghErrorMsg='Нет связи с GitHub — если страница открыта на claude.ai, эта функция здесь недоступна, разместите файл на своём хостинге.';
  }
  renderAll();
}
function scheduleGithubPush(){
  if(!ghConfig || ghStatus==='error') return;
  if(ghPushTimer) clearTimeout(ghPushTimer);
  ghPushTimer = setTimeout(pushToGithub, 4000);
}
async function pushToGithub(){
  if(!ghConfig) return;
  try{
    const body = {message:'Обновление прогресса — '+new Date().toISOString(), content: utf8ToBase64(JSON.stringify(state, null, 2))};
    if(ghSha) body.sha = ghSha;
    const res = await ghRequest('/contents/ege-craft-progress.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(res.status===200 || res.status===201){
      const data = await res.json();
      ghSha = data.content.sha;
      ghStatus='on';
    } else if(res.status===409){
      const fresh = await ghRequest('/contents/ege-craft-progress.json');
      if(fresh.status===200){ const d=await fresh.json(); ghSha=d.sha; await pushToGithub(); return; }
    } else {
      ghStatus='error'; ghErrorMsg='Ошибка сохранения (код '+res.status+').';
    }
  }catch(e){
    ghStatus='error'; ghErrorMsg='Нет связи с GitHub.';
  }
  updateGhStatusUI();
}
function connectGithub(owner, repo, token){
  if(!owner || !repo || !token) return;
  ghConfig = {owner:owner.trim(), repo:repo.trim(), token:token.trim()};
  saveGhConfig(ghConfig);
  initGithubBackup();
}
function disconnectGithub(){
  ghConfig=null; ghSha=null; ghStatus='off';
  clearGhConfig();
  renderAll();
}

/* ---- cross-device sync (db capability) ---- */
let dbApi = null;
let syncCode = null;
let syncState = 'checking'; // checking | unavailable | off | on

function genSyncCode(){
  const adjectives = ['бодрый','тихий','яркий','смелый','мудрый','быстрый','ясный','тёплый'];
  const animals = ['лис','сокол','барсук','дельфин','рысь','сова','ёж','кит'];
  const a = adjectives[Math.floor(Math.random()*adjectives.length)];
  const b = animals[Math.floor(Math.random()*animals.length)];
  const n = 10 + Math.floor(Math.random()*90);
  return a+'-'+b+'-'+n;
}
function pushSync(){
  if(dbApi && syncCode){
    dbApi.doc('students/'+syncCode).set({state, updatedAt:new Date().toISOString()}).catch(()=>{});
  }
}
async function initSync(){
  if(!window.claude || typeof window.claude.use !== 'function'){ syncState='unavailable'; return; }
  try{ dbApi = await window.claude.use('db'); }catch(e){ dbApi = null; }
  if(!dbApi){ syncState='unavailable'; return; }
  try{ syncCode = localStorage.getItem('ege-craft-sync-code'); }catch(e){ syncCode = null; }
  if(syncCode){
    syncState='on';
    try{
      const snap = await dbApi.doc('students/'+syncCode).get();
      if(snap.exists && snap.data() && snap.data().state){ state = Object.assign(defaultState(), snap.data().state); }
      else{ await dbApi.doc('students/'+syncCode).set({state, updatedAt:new Date().toISOString()}); }
    }catch(e){}
    renderAll();
  } else {
    syncState='off';
    renderAll();
  }
}
async function createSyncCode(){
  if(!dbApi) return;
  syncCode = genSyncCode();
  try{ localStorage.setItem('ege-craft-sync-code', syncCode); }catch(e){}
  syncState='on';
  try{ await dbApi.doc('students/'+syncCode).set({state, updatedAt:new Date().toISOString()}); }catch(e){}
  renderAll();
}
async function connectSyncCode(inputVal){
  if(!dbApi) return;
  const code = (inputVal||'').trim().toLowerCase();
  const el = document.getElementById('sync-error');
  if(!code) return;
  try{
    const snap = await dbApi.doc('students/'+code).get();
    if(!snap.exists){ if(el) el.textContent='Код не найден — проверь и попробуй ещё раз.'; return; }
    state = Object.assign(defaultState(), snap.data().state||{});
    syncCode = code;
    try{ localStorage.setItem('ege-craft-sync-code', syncCode); }catch(e){}
    syncState='on';
    try{ localStorage.setItem('ege-craft-v1', JSON.stringify(state)); }catch(e){}
    renderAll();
  }catch(e){ if(el) el.textContent='Не удалось подключиться. Попробуй ещё раз.'; }
}
function disconnectSync(){
  syncCode = null; syncState='off';
  try{ localStorage.removeItem('ege-craft-sync-code'); }catch(e){}
  renderAll();
}

/* ================= SPACED REPETITION ================= */
const ERROR_INTERVALS = [1,3,7,14,21];
const FLASH_INTERVALS = [1,2,4,7,14,30];

function registerAnswer(q, correct){
  const key = q.subjectId+'::'+q.topicId;
  const p = state.progress[key] || (state.progress[key] = {status:'new', correct:0, total:0});
  p.total++; if(correct) p.correct++;
  if(p.status==='new') p.status='learning';
  if(correct && p.correct/p.total >= 0.8 && p.total>=4) p.status='done';
  else if(p.status==='done' && !correct) p.status='review';

  if(q.generated){ persist(); return; }
  const existing = state.errors.find(e=>e.qId===q.id);
  if(!correct){
    if(existing){ existing.misses++; existing.nextReview = addDays(todayStr(), ERROR_INTERVALS[Math.min(existing.misses-1, ERROR_INTERVALS.length-1)]); }
    else{ state.errors.push({qId:q.id, misses:1, nextReview: addDays(todayStr(),1)}); }
  } else if(existing){
    state.errors = state.errors.filter(e=>e.qId!==q.id);
  }
  persist();
}

function dueErrors(subjectId){
  const t = todayStr();
  return state.errors.filter(e=> (!subjectId || questionsById[e.qId].subjectId===subjectId) && e.nextReview<=t);
}
function dueFlashcards(subjectId){
  const t = todayStr();
  return FLASHCARDS.filter(c=>{
    if(subjectId && subjectId!=='all' && c.subjectId!==subjectId) return false;
    const st = state.flash[c.id];
    return !st || st.nextReview<=t;
  });
}

/* ================= HELPERS ================= */
function relDate(dateStr){
  const d = daysDiff(todayStr(), dateStr);
  if(d<0) return 'просрочено на '+(-d)+' дн.';
  if(d===0) return 'сегодня';
  if(d===1) return 'завтра';
  if(d>=2 && d<=4) return 'через '+d+' дня';
  return 'через '+d+' дн.';
}
function predictedScore(subjectId){
  const h = state.history[subjectId];
  if(!h || !h.length) return null;
  const last3 = h.slice(-3);
  return Math.round(last3.reduce((a,b)=>a+b,0)/last3.length);
}
function subjectAccuracy(subjectId){
  const s = subjectsById[subjectId];
  let c=0,t=0;
  s.topics.forEach(top=>{ const p = state.progress[subjectId+'::'+top.id]; if(p){ c+=p.correct; t+=p.total; } });
  return t? Math.round(c/t*100) : null;
}
function subjectTopicsClosedPct(subjectId){
  const s = subjectsById[subjectId];
  const closed = s.topics.filter(top=>{ const p = state.progress[subjectId+'::'+top.id]; return p && p.status==='done'; }).length;
  return Math.round(closed/s.topics.length*100);
}
function esc(str){ return String(str).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ================= TEST / PRACTICE SESSION ================= */
function collectQuestions(subjectId, mode){
  const s = subjectsById[subjectId];
  let all = [];
  s.topics.forEach(t=> all = all.concat(t.questions.map(q=>Object.assign({topicId:t.id, subjectId}, q))));
  if(mode==='topic'){
    const t = s.topics[Math.floor(Math.random()*s.topics.length)];
    return t.questions.map(q=>Object.assign({topicId:t.id, subjectId}, q));
  }
  if(mode==='mock'){
    return shuffle(all.slice());
  }
  return shuffle(all.slice()).slice(0, Math.min(10, all.length));
}
const TYPE_SECONDS = {single:70, multiple:90, short:80, match:100, order:90, self:300};
function estimateSeconds(qs){ return qs.reduce((sum,q)=> sum + (TYPE_SECONDS[q.type]||90), 0); }
function startTest(subjectId, mode){
  const qs = collectQuestions(subjectId, mode);
  session = {subjectId, mode, questions:qs, index:0, answers:{}, seconds: mode==='mock'? estimateSeconds(qs) : null, startedAt: Date.now()};
  route = {view:'runner', params:{}};
  renderAll();
  if(mode==='mock') startTimer();
}
function startGenTest(subjectId, topicId){
  session = {subjectId, mode:'gen', genTopic: topicId||null, questions:[topicId? genQuestion(topicId) : genQuestionAnySubjectTopic(subjectId)], index:0, answers:{}, seconds:null};
  route = {view:'runner', params:{}};
  renderAll();
}
function nextGenQuestion(){
  session.questions.push(session.genTopic? genQuestion(session.genTopic) : genQuestionAnySubjectTopic(session.subjectId));
  session.index++;
  renderRunner();
}
function startSingleQuestion(subjectId, qId){
  const q = questionsById[qId];
  session = {subjectId, mode:'practice', questions:[Object.assign({}, q)], index:0, answers:{}, seconds:null};
  route = {view:'runner', params:{}};
  renderAll();
}
function startRandomPractice(){
  const s = SUBJECTS[Math.floor(Math.random()*SUBJECTS.length)];
  const all = [];
  s.topics.forEach(t=>t.questions.forEach(q=>all.push(Object.assign({topicId:t.id, subjectId:s.id}, q))));
  const picks = shuffle(all.slice()).slice(0,5);
  session = {subjectId:s.id, mode:'mixed', questions:picks, index:0, answers:{}, seconds:null};
  route = {view:'runner', params:{}};
  renderAll();
}
function openMockPicker(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-card col gap-16">'
    + '<h2 class="serif" style="font-size:22px">Выбери предмет для пробника</h2>'
    + '<div class="col gap-8">' + SUBJECTS.map(s=>'<button class="cta-ghost" style="justify-content:flex-start" onclick="closeModal();startTest(\''+s.id+'\',\'mock\')">'+icon(s.icon)+' '+s.name+'</button>').join('') + '</div>'
    + '<button class="cta-ghost" onclick="closeModal()">Отмена</button>'
    + '</div></div>';
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startTimer(){
  updateTimerDisplay();
  timerHandle = setInterval(()=>{
    if(!session) { clearInterval(timerHandle); return; }
    session.seconds--;
    updateTimerDisplay();
    if(session.seconds<=0){ clearInterval(timerHandle); finishSession(); }
  },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timer-display');
  if(!el || !session) return;
  const m = Math.floor(session.seconds/60), sec = session.seconds%60;
  el.textContent = (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function renderRunner(){
  if(!session){ go('dashboard'); return; }
  const q = session.questions[session.index];
  const ans = session.answers[q.id];
  const s = subjectsById[session.subjectId];
  const c = COLOR_MAP[s.color];

  const dots = session.questions.map((qq,i)=>'<span class="'+(i<session.index?'done':i===session.index?'now':'')+'"></span>').join('');

  let inputHtml = '';
  if(!ans || !ans.checked){
    inputHtml = renderQuestionInput(q);
  } else {
    inputHtml = renderQuestionReadonly(q, ans);
  }

  let feedback = '';
  if(ans && ans.checked){
    feedback = '<div class="feedback-box '+(ans.correct?'ok':'no')+'">'
      + '<strong>'+(ans.correct? (q.type==='self' ? 'Оценка засчитана' : 'Верно!') : 'Не совсем')+'</strong>'
      + '<span>'+q.explanation+'</span>'
      + (!ans.correct ? '<button class="cta-ghost" style="align-self:flex-start" onclick="go(\'subject\',{subjectId:\''+session.subjectId+'\'});setSubjectTab(\''+session.subjectId+'\',\'theory\')">Повторить тему</button>' : '')
      + '</div>';
  }

  const isGen = session.mode==='gen';
  const isLast = !isGen && session.index===session.questions.length-1;
  const actionBtn = !ans || !ans.checked
    ? '<button class="cta-pill" onclick="checkCurrent()">Проверить</button>'
    : isGen ? '<button class="cta-pill" onclick="nextGenQuestion()">Следующий вопрос '+icon('arrow')+'</button>'
    : (isLast ? '<button class="cta-pill" onclick="finishSession()">Завершить</button>' : '<button class="cta-pill" onclick="nextQuestion()">Далее '+icon('arrow')+'</button>');

  document.getElementById('main').innerHTML = ''
    + '<div class="row between wrap gap-12">'
      + '<button class="cta-ghost" onclick="exitRunner()">'+icon('x')+' Выйти</button>'
      + (session.mode==='mock' ? '<div class="row gap-8">'+icon('clock')+'<strong class="num" id="timer-display" style="font-size:16px">--:--</strong></div>' : '')
      + (isGen ? '<span class="qtype-pill">'+icon('chart')+' Тренажёр · вопрос '+(session.index+1)+'</span>' : '<div class="progress-dots">'+dots+'</div>')
    + '</div>'
    + '<div class="card col gap-20">'
      + '<div class="row between"><span class="qtype-pill">'+QTYPE_LABEL[q.type]+'</span><span class="muted" style="font-size:13px">'+(isGen? topicsById[q.subjectId+'::'+q.topicId].title : 'Вопрос '+(session.index+1)+' из '+session.questions.length)+'</span></div>'
      + '<h2 class="serif" style="font-size:22px;line-height:1.35">'+q.prompt+'</h2>'
      + (q.figure ? '<div class="figure-box">'+q.figure+'</div>' : '')
      + inputHtml
      + feedback
      + '<div class="row" style="justify-content:flex-end">'+actionBtn+'</div>'
    + '</div>';

  if(session.mode==='mock') updateTimerDisplay();
}

function renderQuestionInput(q){
  if(q.type==='single'){
    return '<div class="col gap-10">' + q.options.map((o,i)=>'<label class="opt-row"><input type="radio" name="opt" value="'+i+'" '+(session.answers[q.id]&&session.answers[q.id].userAnswer===i?'checked':'')+' onchange="setAnswer(\''+q.id+'\','+i+')"><span>'+o+'</span></label>').join('') + '</div>';
  }
  if(q.type==='multiple'){
    const cur = (session.answers[q.id] && session.answers[q.id].userAnswer) || [];
    return '<div class="col gap-10">' + q.options.map((o,i)=>'<label class="opt-row"><input type="checkbox" value="'+i+'" '+(cur.includes(i)?'checked':'')+' onchange="toggleMultiAnswer(\''+q.id+'\','+i+')"><span>'+o+'</span></label>').join('') + '</div>';
  }
  if(q.type==='short'){
    const cur = (session.answers[q.id] && session.answers[q.id].userAnswer) || '';
    return '<input class="text-input" placeholder="Введите ответ" value="'+esc(cur)+'" oninput="setAnswer(\''+q.id+'\', this.value)">';
  }
  if(q.type==='match'){
    if(!q._shuffledRight) q._shuffledRight = shuffle(q.pairs.map(p=>p[1]).slice());
    const cur = (session.answers[q.id] && session.answers[q.id].userAnswer) || {};
    return '<div class="col gap-10">' + q.pairs.map((p,i)=>'<div class="row between gap-12"><span style="font-size:14px">'+p[0]+'</span><select class="match-select" onchange="setMatchAnswer(\''+q.id+'\','+i+',this.value)"><option value="">Выбрать…</option>'+q._shuffledRight.map(r=>'<option value="'+esc(r)+'" '+(cur[i]===r?'selected':'')+'>'+r+'</option>').join('')+'</select></div>').join('') + '</div>';
  }
  if(q.type==='order'){
    if(!q._order) q._order = shuffle(q.items.slice());
    return '<div class="col gap-8">' + q._order.map((it,i)=>'<div class="order-row"><span class="num" style="width:20px;color:var(--color-stone)">'+(i+1)+'</span><span style="font-size:14px">'+it+'</span><div class="order-btns"><button onclick="moveOrder(\''+q.id+'\','+i+',-1)">'+icon('chevron')+'</button><button onclick="moveOrder(\''+q.id+'\','+i+',1)" style="transform:rotate(180deg)">'+icon('chevron')+'</button></div></div>').join('') + '</div>';
  }
  if(q.type==='self'){
    const revealed = !!(session.answers[q.id] && session.answers[q.id].revealed);
    if(!revealed){
      return '<div class="col gap-12"><textarea class="text-input" rows="4" placeholder="Напишите свой ответ (для тренировки)"></textarea><button class="cta-ghost" style="align-self:flex-start" onclick="revealSelf(\''+q.id+'\')">Показать образец и критерии</button></div>';
    }
    const checked = (session.answers[q.id] && session.answers[q.id].userAnswer) || [];
    return '<div class="col gap-12">'
      + '<div class="card-flat col gap-8"><span class="label-caps">Пример ответа на максимум</span><p style="font-size:14px;line-height:1.55">'+q.modelAnswer+'</p></div>'
      + '<div class="col gap-8"><span class="label-caps">Отметь, что есть в твоём ответе</span>' + q.criteria.map((cr,i)=>'<label class="opt-row"><input type="checkbox" '+(checked.includes(i)?'checked':'')+' onchange="toggleSelfCriterion(\''+q.id+'\','+i+')"><span>'+cr.text+' <span class="muted">(+'+cr.points+')</span></span></label>').join('') + '</div>'
      + '<strong class="num">Баллы: '+ checked.reduce((sum,i)=>sum+q.criteria[i].points,0) +' из '+q.maxPoints+'</strong>'
      + '</div>';
  }
  return '';
}

function renderQuestionReadonly(q, ans){
  if(q.type==='single'){
    return '<div class="col gap-10">' + q.options.map((o,i)=>{
      let cls='opt-row';
      if(i===q.correctIndex) cls+=' correct'; else if(i===ans.userAnswer) cls+=' incorrect';
      return '<div class="'+cls+'"><span>'+o+'</span></div>';
    }).join('') + '</div>';
  }
  if(q.type==='multiple'){
    return '<div class="col gap-10">' + q.options.map((o,i)=>{
      let cls='opt-row'; const chosen=(ans.userAnswer||[]).includes(i); const isCorrect=q.correctIndexes.includes(i);
      if(isCorrect) cls+=' correct'; else if(chosen) cls+=' incorrect';
      return '<div class="'+cls+'"><span>'+o+'</span></div>';
    }).join('') + '</div>';
  }
  if(q.type==='short'){
    return '<div class="col gap-6"><input class="text-input" value="'+esc(ans.userAnswer||'')+'" disabled style="opacity:.7"><span class="muted" style="font-size:13px">Правильный ответ: '+q.accept[0]+'</span></div>';
  }
  if(q.type==='match'){
    return '<div class="col gap-10">' + q.pairs.map((p,i)=>{
      const chosen = (ans.userAnswer||{})[i];
      const ok = chosen===p[1];
      return '<div class="row between gap-12" style="padding:10px 12px;border-radius:12px;background:'+(ok?'#eef8f0':'#fbeeea')+'"><span style="font-size:14px">'+p[0]+'</span><span style="font-size:14px;font-weight:600">'+p[1]+(ok?'':' <span class="muted">(было: '+(chosen||'—')+')</span>')+'</span></div>';
    }).join('') + '</div>';
  }
  if(q.type==='order'){
    return '<div class="col gap-8">' + q.items.map((it,i)=>'<div class="order-row"><span class="num" style="width:20px;color:var(--color-good)">'+(i+1)+'</span><span style="font-size:14px">'+it+'</span></div>').join('') + '</div>';
  }
  if(q.type==='self'){
    return '<div class="card-flat"><strong class="num">Твоя самооценка: '+ans.score+' из '+q.maxPoints+' баллов</strong></div>';
  }
  return '';
}

function setAnswer(qId, val){ const s=session.answers[qId]||(session.answers[qId]={}); s.userAnswer=val; }
function toggleMultiAnswer(qId, idx){
  const s = session.answers[qId]||(session.answers[qId]={userAnswer:[]});
  if(!s.userAnswer) s.userAnswer=[];
  const p = s.userAnswer.indexOf(idx);
  if(p>-1) s.userAnswer.splice(p,1); else s.userAnswer.push(idx);
}
function setMatchAnswer(qId, rowIdx, val){
  const s = session.answers[qId]||(session.answers[qId]={userAnswer:{}});
  if(!s.userAnswer) s.userAnswer={};
  s.userAnswer[rowIdx]=val;
}
function moveOrder(qId, idx, dir){
  const q = session.questions.find(x=>x.id===qId);
  const arr = q._order;
  const j = idx+dir;
  if(j<0||j>=arr.length) return;
  [arr[idx],arr[j]]=[arr[j],arr[idx]];
  renderRunner();
}
function revealSelf(qId){ const s = session.answers[qId]||(session.answers[qId]={userAnswer:[]}); s.revealed=true; if(!s.userAnswer) s.userAnswer=[]; renderRunner(); }
function toggleSelfCriterion(qId, idx){
  const s = session.answers[qId];
  const p = s.userAnswer.indexOf(idx);
  if(p>-1) s.userAnswer.splice(p,1); else s.userAnswer.push(idx);
  renderRunner();
}

function checkCurrent(){
  const q = session.questions[session.index];
  const s = session.answers[q.id] || (session.answers[q.id]={});
  let correct = false;
  if(q.type==='single') correct = s.userAnswer===q.correctIndex;
  else if(q.type==='multiple'){
    const u=(s.userAnswer||[]).slice().sort(); const c=q.correctIndexes.slice().sort();
    correct = u.length===c.length && u.every((v,i)=>v===c[i]);
  } else if(q.type==='short'){
    const norm = (s.userAnswer||'').trim().toLowerCase().replace(/ё/g,'е');
    correct = q.accept.some(a=>a.toLowerCase().replace(/ё/g,'е')===norm);
  } else if(q.type==='match'){
    correct = q.pairs.every((p,i)=> (s.userAnswer||{})[i]===p[1]);
  } else if(q.type==='order'){
    correct = q._order && q._order.every((it,i)=>it===q.items[i]);
  } else if(q.type==='self'){
    if(!s.revealed){ revealSelf(q.id); return; }
    const score = (s.userAnswer||[]).reduce((sum,i)=>sum+q.criteria[i].points,0);
    s.score = score;
    correct = score/q.maxPoints >= 0.6;
  }
  s.checked = true; s.correct = correct;
  registerAnswer(q, correct);
  renderSidebar();
  renderRunner();
}
function nextQuestion(){ session.index++; renderRunner(); }
function exitRunner(){ if(timerHandle){clearInterval(timerHandle);timerHandle=null;} go(session? 'subject':'dashboard', session?{subjectId:session.subjectId}:{}); }

function finishSession(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
  const total = session.questions.length;
  const correctCount = Object.values(session.answers).filter(a=>a.checked && a.correct).length;
  const pct = Math.round(correctCount/total*100);
  if(session.mode==='mixed' || session.mode==='mock'){
    const h = state.history[session.subjectId] || (state.history[session.subjectId]=[]);
    h.push(pct); if(h.length>8) h.shift();
    persist();
  }
  const weakTopics = [...new Set(session.questions.filter(q=>{ const a=session.answers[q.id]; return !a || !a.correct; }).map(q=>q.topicId))]
    .map(tid=>topicsById[session.subjectId+'::'+tid].title);

  document.getElementById('main').innerHTML = '<div class="card col gap-18" style="text-align:center;align-items:center;padding:44px 24px">'
    + '<span class="label-caps">Результат</span>'
    + '<h1 class="serif" style="font-size:44px">'+correctCount+' / '+total+'</h1>'
    + '<p class="muted">Правильных ответов: '+pct+'%</p>'
    + (weakTopics.length ? '<div class="card-flat" style="max-width:420px"><span class="label-caps">Стоит повторить</span><p style="font-size:14px;margin-top:6px">'+weakTopics.join(', ')+'</p></div>' : '<p style="color:var(--color-good);font-weight:600">Все ответы верны — отличная работа!</p>')
    + '<div class="row gap-12"><button class="cta-pill" onclick="go(\'errors\')">К ошибочнику</button><button class="cta-ghost" onclick="go(\'dashboard\')">На дашборд</button></div>'
    + '</div>';
  session = null;
}

function setFlashDeck(id){ ui.flashDeck=id; ui.flashIndex=0; ui.flashFlipped=false; renderFlashcards(); }
function flipFlash(){ ui.flashFlipped=!ui.flashFlipped; renderFlashcards(); }
function answerFlash(knew){
  const due = dueFlashcards(ui.flashDeck);
  const card = due[ui.flashIndex];
  const st = state.flash[card.id] || (state.flash[card.id]={box:0, nextReview:todayStr()});
  st.box = knew ? Math.min(st.box+1, FLASH_INTERVALS.length-1) : 0;
  st.nextReview = addDays(todayStr(), FLASH_INTERVALS[st.box]);
  persist();
  ui.flashFlipped=false;
  ui.flashIndex++;
  renderSidebar();
  renderFlashcards();
}

/* ================= PROGRESS VIEW ================= */
async function exportProgress(){
  const el = document.getElementById('backup-status');
  const filename = 'ege-craft-progress-'+todayStr()+'.json';
  const text = JSON.stringify(state, null, 2);
  if(window.claude && typeof window.claude.use === 'function'){
    let downloadsApi = null;
    try{ downloadsApi = await window.claude.use('downloads'); }catch(e){}
    if(downloadsApi){
      try{
        await downloadsApi.save({filename, data:text});
        if(el) el.textContent = 'Файл сохранён — не забудь убрать его в надёжное место.';
      }catch(err){
        if(el) el.textContent = (err && err.code==='declined') ? 'Сохранение отменено.' : 'Не удалось сохранить файл. Попробуй ещё раз.';
      }
      return;
    }
  }
  try{
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(el) el.textContent = 'Файл сохранён — не забудь убрать его в надёжное место.';
  }catch(e){
    if(el) el.textContent = 'Не удалось сохранить файл в этом браузере.';
  }
}
function importProgressFile(input){
  const file = input.files && input.files[0];
  const el = document.getElementById('backup-status');
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object' || !parsed.progress) throw new Error('bad shape');
      state = Object.assign(defaultState(), parsed);
      persist();
      renderAll();
      if(el) el.textContent = 'Прогресс восстановлен из файла.';
    }catch(err){
      if(el) el.textContent = 'Не получилось прочитать файл — убедись, что это файл, скачанный отсюда же.';
    }
  };
  reader.readAsText(file);
  input.value = '';
}
function renderBackupCard(){
  return '<div class="card col gap-12">'
    + '<div class="row gap-10">'+icon('cards')+'<strong style="font-size:15px">Резервная копия прогресса</strong></div>'

    + '<div class="row gap-10 wrap" style="align-items:center">'
      + '<button class="cta-pill" onclick="exportProgress()">Скачать прогресс</button>'
      + '<label class="cta-ghost" style="cursor:pointer">Загрузить из файла<input type="file" accept="application/json" style="display:none" onchange="importProgressFile(this)"></label>'
    + '</div>'
    + '<span id="backup-status" class="muted" style="font-size:13px"></span>'
    + '</div>';
}
function renderSyncCard(){
  if(syncState==='unavailable' || syncState==='checking') return '';
  if(syncState==='on'){
    return '<div class="card row between wrap gap-16" style="align-items:center">'
      + '<div class="row gap-10">'+icon('cards')+'<div class="col gap-4"><strong style="font-size:15px">Синхронизация включена</strong><span class="muted" style="font-size:12px">Твой код: <span class="num" style="font-weight:700">'+syncCode+'</span> — введи его на другом устройстве, чтобы продолжить оттуда</span></div></div>'
      + '<button class="cta-ghost" onclick="disconnectSync()">Отключить</button>'
      + '</div>';
  }
  return '<div class="card col gap-12">'
    + '<div class="row gap-10">'+icon('cards')+'<strong style="font-size:15px">Синхронизация между устройствами</strong></div>'
    + '<p class="muted" style="font-size:13px;max-width:520px">Создай код на этом устройстве и введи его на другом, чтобы продолжить с того же места. Это не защищённый вход — код знает каждый, кому ты его покажешь.</p>'
    + '<div class="row gap-10 wrap" style="align-items:center">'
      + '<button class="cta-pill" onclick="createSyncCode()">Создать код</button>'
      + '<input class="text-input" id="sync-input" placeholder="Ввести код с другого устройства" style="max-width:240px">'
      + '<button class="cta-ghost" onclick="connectSyncCode(document.getElementById(\'sync-input\').value)">Войти по коду</button>'
    + '</div>'
    + '<span id="sync-error" style="color:var(--color-bad);font-size:13px"></span>'
    + '</div>';
}
function renderProgress(){
  const cards = SUBJECTS.map(s=>{
    const pct = subjectTopicsClosedPct(s.id);
    const acc = subjectAccuracy(s.id);
    const pred = predictedScore(s.id);
    const h = state.history[s.id]||[];
    const max = Math.max(...h,1);
    const bars = h.map(v=>'<div class="bar" style="height:'+Math.max(8,Math.round(v/max*56))+'px;background:'+ (COLOR_MAP[s.color].bg.indexOf('gradient')>-1?'var(--color-sky-1)':COLOR_MAP[s.color].bg) +'"></div>').join('');
    return '<div class="card col gap-14">'
      + '<div class="row between"><strong style="font-size:16px">'+s.name+'</strong><span class="qtype-pill">'+icon(s.icon)+'</span></div>'
      + '<div class="row between"><div class="col"><span class="label-caps">Темы</span><strong class="num" style="font-size:20px">'+pct+'%</strong></div>'
        + '<div class="col"><span class="label-caps">Точность</span><strong class="num" style="font-size:20px">'+(acc!==null?acc+'%':'—')+'</strong></div>'
        + '<div class="col"><span class="label-caps">Прогноз</span><strong class="num" style="font-size:20px">'+(pred!==null?pred:'—')+'</strong></div></div>'
      + '<div class="col gap-6"><span class="label-caps">Последние тесты</span><div class="bars">'+bars+'</div></div>'
    + '</div>';
  }).join('');

  const cal = state.streak.last14.map(v=>'<span class="'+(v?'on':'')+'"></span>').join('');

  document.getElementById('main').innerHTML = '<h1 class="serif" style="font-size:30px">Прогресс</h1>'
    + '<div class="card row between wrap gap-16" style="align-items:center">'
      + '<div class="row gap-10"><span class="streak-flame">🔥</span><div class="col"><strong class="num" style="font-size:20px">'+state.streak.count+' дней подряд</strong><span class="muted" style="font-size:12px">Последние 14 дней</span></div></div>'
      + '<div class="calendar-strip">'+cal+'</div>'
    + '</div>'
    + renderBackupCard()
    + renderGithubCard()
    + renderSyncCard()
    + '<div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">'+cards+'</div>';
  updateGhStatusUI();
}
function renderGithubCard(){
  if(!ghConfig){
    return '<div class="card col gap-12">'
      + '<div class="row gap-10">'+icon('cards')+'<strong style="font-size:15px">Автосохранение через GitHub</strong></div>'
      + '<p class="muted" style="font-size:13px;max-width:560px">Прогресс будет сам сохраняться в твой приватный репозиторий на GitHub и подтягиваться на любом устройстве, где ты введёшь те же данные. Нужен приватный репозиторий (например «ege-progress») и fine-grained токен доступа (GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens) с правом «Contents: Read and write», выданным только для этого репозитория.</p>'
      + '<p style="color:var(--color-bad);font-size:12px;max-width:560px">Токен хранится в этом браузере в открытом виде. Никогда не используй классический токен с доступом ко всем репозиториям — только fine-grained токен, ограниченный одним репозиторием. Эта функция не работает на странице claude.ai — только если файл размещён на собственном хостинге.</p>'
      + '<div class="row gap-10 wrap">'
        + '<input class="text-input" id="gh-owner" placeholder="Логин на GitHub" style="max-width:160px">'
        + '<input class="text-input" id="gh-repo" placeholder="Название репозитория" style="max-width:180px">'
        + '<input class="text-input" id="gh-token" type="password" placeholder="Токен доступа" style="max-width:220px">'
      + '</div>'
      + '<button class="cta-pill" style="align-self:flex-start" onclick="connectGithub(document.getElementById(\'gh-owner\').value, document.getElementById(\'gh-repo\').value, document.getElementById(\'gh-token\').value)">Подключить</button>'
      + '<span id="gh-status" class="muted" style="font-size:13px"></span>'
      + '</div>';
  }
  return '<div class="card row between wrap gap-16" style="align-items:center">'
    + '<div class="row gap-10">'+icon('cards')+'<div class="col gap-4"><strong style="font-size:15px">GitHub: '+ghConfig.owner+'/'+ghConfig.repo+'</strong><span id="gh-status" class="muted" style="font-size:12px"></span></div></div>'
    + '<button class="cta-ghost" onclick="disconnectGithub()">Отключить</button>'
    + '</div>';
}

/* ================= MASTER RENDER ================= */
function renderAll(){
  renderSidebar();
  if(route.view==='dashboard') renderDashboard();
  else if(route.view==='subject') renderSubject(route.params.subjectId);
  else if(route.view==='errors') renderErrors();
  else if(route.view==='flashcards') renderFlashcards();
  else if(route.view==='progress') renderProgress();
  else if(route.view==='runner') renderRunner();
}

renderAll();
initSync();
initGithubBackup();
</script>
